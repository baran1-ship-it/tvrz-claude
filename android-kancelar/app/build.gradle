plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.baran.kancelar'
    compileSdk 34

    defaultConfig {
        applicationId 'cz.baran.kancelar'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Pro jednoduchou instalaci je release podepsán debug klíčem.
            // Pro Google Play si vytvořte vlastní klíč (Build > Generate Signed APK).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
