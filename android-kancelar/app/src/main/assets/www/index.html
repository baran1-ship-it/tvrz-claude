<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kancelář</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Horní lišta -->
<header id="topbar">
  <button id="btnBack" class="icon" title="Zpět" hidden>
    <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
  </button>
  <div id="title">Kancelář</div>
  <button id="btnMode" class="icon" title="Upravit" hidden>
    <svg viewBox="0 0 24 24"><path d="M3 17.2V21h3.8L17.8 9.9l-3.8-3.8L3 17.2zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8L20.7 7z"/></svg>
  </button>
  <button id="btnSave" class="icon" title="Uložit" hidden>
    <svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"/></svg>
  </button>
  <button id="btnMenu" class="icon" title="Další" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
  </button>
</header>
<div id="menu" class="menu" hidden></div>

<!-- Úvodní obrazovka -->
<main id="home" class="screen">
  <section class="actions">
    <button class="card" id="btnOpen">
      <span class="badge open"><svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg></span>
      <span><b>Otevřít soubor</b><small>Word (.docx), Excel (.xlsx, .xls), .ods, .csv</small></span>
    </button>
    <button class="card" id="btnNewDoc">
      <span class="badge word">W</span>
      <span><b>Nový dokument</b><small>Prázdný dokument Word</small></span>
    </button>
    <button class="card" id="btnNewSheet">
      <span class="badge excel">X</span>
      <span><b>Nová tabulka</b><small>Prázdný sešit Excel</small></span>
    </button>
  </section>
  <h2 class="section-title" id="recentTitle" hidden>Naposledy otevřené</h2>
  <ul id="recent" class="recent"></ul>
  <p class="hint" id="emptyHint">Soubory můžete otevřít také přímo ze Správce souborů, e‑mailu nebo Disku Google přes „Otevřít v aplikaci → Kancelář“.</p>
  <input type="file" id="fileInput" accept=".docx,.xlsx,.xls,.xlsm,.ods,.csv" hidden>
</main>

<!-- Editor Word -->
<main id="word" class="screen" hidden>
  <div id="wordToolbar" class="toolbar" hidden>
    <button data-cmd="undo" title="Zpět"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.6 0-5 1-6.9 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 20.2 16l2.4-.8A10.5 10.5 0 0 0 12.5 8z"/></svg></button>
    <button data-cmd="redo" title="Znovu"><svg viewBox="0 0 24 24"><path d="M18.4 10.6A10.5 10.5 0 0 0 1.4 15.2l2.4.8A8 8 0 0 1 16.6 12.4L13 16h9V7l-3.6 3.6z"/></svg></button>
    <select id="blockStyle" title="Styl odstavce">
      <option value="p">Normální</option>
      <option value="h1">Nadpis 1</option>
      <option value="h2">Nadpis 2</option>
      <option value="h3">Nadpis 3</option>
      <option value="h4">Nadpis 4</option>
    </select>
    <button data-cmd="bold" title="Tučně"><b>B</b></button>
    <button data-cmd="italic" title="Kurzíva"><i>I</i></button>
    <button data-cmd="underline" title="Podtržení"><u>U</u></button>
    <button data-cmd="strikeThrough" title="Přeškrtnutí"><s>S</s></button>
    <label class="colorBtn" title="Barva písma">A<input type="color" id="foreColor" value="#c00000"></label>
    <label class="colorBtn hl" title="Zvýraznění"><span>ab</span><input type="color" id="hiliteColor" value="#ffff00"></label>
    <button data-cmd="insertUnorderedList" title="Odrážky"><svg viewBox="0 0 24 24"><path d="M4 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0-6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0 12a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg></button>
    <button data-cmd="insertOrderedList" title="Číslování"><svg viewBox="0 0 24 24"><path d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg></button>
    <button data-cmd="outdent" title="Zmenšit odsazení"><svg viewBox="0 0 24 24"><path d="M11 17h10v-2H11v2zm-8-5 4 4V8l-4 4zm0 9h18v-2H3v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z"/></svg></button>
    <button data-cmd="indent" title="Zvětšit odsazení"><svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zM3 8v8l4-4-4-4zm8 9h10v-2H11v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z"/></svg></button>
    <button data-cmd="justifyLeft" title="Zarovnat vlevo"><svg viewBox="0 0 24 24"><path d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/></svg></button>
    <button data-cmd="justifyCenter" title="Na střed"><svg viewBox="0 0 24 24"><path d="M7 15v2h10v-2H7zm-4 6h18v-2H3v2zm0-8h18v-2H3v2zm4-6v2h10V7H7zM3 3v2h18V3H3z"/></svg></button>
    <button data-cmd="justifyRight" title="Zarovnat vpravo"><svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm6-4h12v-2H9v2zm-6-4h18v-2H3v2zm6-4h12V7H9v2zM3 3v2h18V3H3z"/></svg></button>
    <button data-cmd="justifyFull" title="Do bloku"><svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm0-4h18v-2H3v2zm0-4h18v-2H3v2zm0-4h18V7H3v2zm0-6v2h18V3H3z"/></svg></button>
    <button data-act="table" title="Vložit tabulku"><svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm8 16H5v-6h6v6zm0-8H5V5h6v6zm8 8h-6v-6h6v6zm0-8h-6V5h6v6z"/></svg></button>
    <button data-act="link" title="Odkaz"><svg viewBox="0 0 24 24"><path d="M3.9 12A3.1 3.1 0 0 1 7 8.9h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z"/></svg></button>
    <button data-cmd="removeFormat" title="Vymazat formátování"><svg viewBox="0 0 24 24"><path d="M3.3 5 2 6.3l7 7L6.5 19h3l1.6-3.6 5.6 5.6 1.3-1.3L3.3 5zM6 5v.2L8.8 8h2.4l-.7 1.7 2.1 2.1L14.2 8H20V5H6z"/></svg></button>
  </div>
  <div id="wordScroll">
    <article id="doc" class="page" spellcheck="false"></article>
  </div>
</main>

<!-- Editor Excel -->
<main id="sheet" class="screen" hidden>
  <div class="fbar">
    <span id="cellName">A1</span>
    <input id="cellInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Hodnota nebo =vzorec">
    <button id="cellOk" title="Potvrdit">✓</button>
  </div>
  <div id="sheetToolbar" class="toolbar">
    <button data-act="undo" title="Zpět"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.6 0-5 1-6.9 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 20.2 16l2.4-.8A10.5 10.5 0 0 0 12.5 8z"/></svg></button>
    <button data-act="redo" title="Znovu"><svg viewBox="0 0 24 24"><path d="M18.4 10.6A10.5 10.5 0 0 0 1.4 15.2l2.4.8A8 8 0 0 1 16.6 12.4L13 16h9V7l-3.6 3.6z"/></svg></button>
    <button data-act="rowAbove" class="txt" title="Vložit řádek nad">+ řádek</button>
    <button data-act="colLeft" class="txt" title="Vložit sloupec vlevo">+ sloupec</button>
    <button data-act="rowDel" class="txt" title="Smazat řádek">− řádek</button>
    <button data-act="colDel" class="txt" title="Smazat sloupec">− sloupec</button>
    <button data-act="clear" class="txt" title="Vymazat buňku">Vymazat</button>
    <button data-act="sortAsc" class="txt" title="Seřadit podle sloupce vzestupně">A→Z</button>
    <button data-act="sortDesc" class="txt" title="Seřadit podle sloupce sestupně">Z→A</button>
    <button data-act="sum" class="txt" title="Vložit součet sloupce nad buňkou">Σ</button>
    <button data-act="find" title="Hledat"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg></button>
  </div>
  <div id="gridWrap"><table id="grid"></table></div>
  <div id="status"></div>
  <nav id="tabs"></nav>
</main>

<!-- Dialog -->
<div id="modal" class="modal" hidden>
  <div class="dialog">
    <div id="modalText"></div>
    <div id="modalFields"></div>
    <div class="dialog-buttons" id="modalButtons"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="busy" class="busy" hidden><div class="spinner"></div></div>

<script src="lib/jszip.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/mammoth.browser.min.js"></script>
<script src="core.js"></script>
<script src="docx.js"></script>
<script src="word.js"></script>
<script src="formula.js"></script>
<script src="excel.js"></script>
<script src="app.js"></script>
</body>
</html>
